# Render Blueprint for the Odofy backend (Express on Node; Render's node
# runtime image ships bun, so the build runs `bun install` and the server
# honors Render's injected PORT at deploy time).
#
# Deploy via the Render dashboard ("Blueprint" -> select this repo) or via
# scripts/deploy-render.sh (Render API). Env var VALUES are intentionally NOT
# in this file — supply them in the dashboard (or your env file) at deploy time.
#
# NOTE: odofy-backend already exists on Render (created via the Render API —
# id srv-d9uf4cp5efls739tld10). This Blueprint documents the same
# configuration and is kept in sync with scripts/deploy-render.sh; it is also
# picked up automatically by "New Blueprint Instance" if ever re-created.
services:
  - type: web
    name: odofy-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # Render's node image ships bun; build with `bun install`. Do not use
    # `npm i -g bun` (postinstall download fails, exit 254) and do not start
    # with plain `node` (src/ is CJS under package.json type:module).
    buildCommand: bun install
    startCommand: bun run src/-server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ODOFY_GOOGLE_MAPS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: ODOFY_ADMIN_API_KEY
        sync: false
      - key: AWS_SES_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ODOFY_SYSTEM_FROM_EMAIL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
    # Persistent disk for uploads (driver selfies, IDs, insurance, proof-of-delivery
    # images). REQUIRED on a paid plan if uploads must survive service restarts —
    # the free tier gets an ephemeral disk and all uploads are wiped on redeploy.
    # Enable by uncommenting once the account is on a paid plan:
    # diskMounts:
    #   - name: uploads
    #     mountPath: /opt/render/project/src/uploads
    #     sizeGB: 1
